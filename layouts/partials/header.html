{{- $contact := partial "contact-data.html" . -}}
<div class="site-header-space">
<header class="site-header">
  <div class="site-header-row">
    <div class="site-header-identity">
      {{ with $contact.avatar }}
      <a class="site-header-logo" href="{{ $.Site.Home.RelPermalink }}" aria-label="Homepage">
        <img src="{{ . }}" width="32" height="32" alt="{{ $contact.alt }}">
      </a>
      {{ end }}
      <strong>{{ $contact.username }}</strong>
    </div>

    <div class="site-header-controls">
      <div class="site-search-slot">
        <form class="site-search" id="search-form" role="search" action="{{ .Site.Home.RelPermalink }}" method="get" autocomplete="off">
          <svg class="site-search-icon" aria-hidden="true" viewBox="0 0 16 16" width="16" height="16">
            <path d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 0 1-1.06 1.06ZM11.5 6.75a4.75 4.75 0 1 0-9.5 0 4.75 4.75 0 0 0 9.5 0Z"/>
          </svg>
          <input type="search" name="q" placeholder="Search" aria-label="Search posts" autocomplete="off">
        </form>
      </div>
      <span class="site-header-divider" aria-hidden="true"></span>
      <button class="site-theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
        <span class="site-theme-thumb">
          <svg class="site-theme-moon" aria-hidden="true" viewBox="0 0 16 16" width="14" height="14">
            <path d="M9.6.8a.75.75 0 0 1 .9.9 5.5 5.5 0 0 0 3.8 6.9.75.75 0 0 1 .4 1.1A7 7 0 1 1 9.6.8Z"/>
          </svg>
          <svg class="site-theme-sun" aria-hidden="true" viewBox="0 0 16 16" width="14" height="14">
            <circle cx="8" cy="8" r="3"/>
            <path d="M8 0v2M8 14v2M0 8h2M14 8h2M2.3 2.3l1.4 1.4m8.6 8.6 1.4 1.4M2.3 13.7l1.4-1.4m8.6-8.6 1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
  {{ partial "menus.html" . }}
</header>
</div>
