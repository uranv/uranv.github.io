baseURL: "https://uranv.github.io/"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
title: "URAN"

module:
  imports:
    - path: github.com/MeiK2333/github-style

buildFuture: true
hasCJKLanguage: true
enableRobotsTXT: true
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]

# The theme reads content/post; public URLs keep the old /posts/ paths.
permalinks:
  page:
    post: "/posts/:slug/"
  section:
    post: "/posts/"

params:
  # Personal information and social links are maintained in data/contact.yaml.
  rss: true
  enableSearch: true
  custom_css: ["css/custom.css", "css/header.css"]
  defer_custom_js: ["js/header.js"]

outputs:
  home: ["HTML", "RSS", "JSON"]

markup:
  highlight:
    codeFences: true
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
